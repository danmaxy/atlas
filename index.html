<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Atlas - Repositório de Softwares</title> 
    <script src="https://unpkg.com/lucide@latest"></script> 
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"> 
     
    <style> 
        :root { 
            --bg-body: #050505; 
            --card-bg: #0a0a0a; 
            --primary: #2563eb; 
            --primary-hover: #3b82f6;
            --text-main: #ffffff; 
            --text-muted: #a1a1aa; 
            --border: rgba(255, 255, 255, 0.08); 
        } 

        * {  
            margin: 0; padding: 0; box-sizing: border-box;  
            font-family: 'Plus Jakarta Sans', sans-serif;  
            -webkit-font-smoothing: antialiased;
        } 
         
        body { 
            background-color: var(--bg-body); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 24px; 
            color: var(--text-main); 
        } 

        /* Card Ultra Minimalista */ 
        .card { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 380px; 
            padding: 48px 32px; 
            border-radius: 24px; 
            text-align: center; 
            border: 1px solid var(--border); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        } 

        /* Logo Elegante e Estática */ 
        .logo-wrapper { 
            width: 90px; 
            height: 90px; 
            margin: 0 auto 32px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        } 

        .logo-wrapper img { 
            max-width: 100%; 
            height: auto; 
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.05)); 
        } 

        /* Tipografia Profissional */
        h1 {  
            font-size: 1.5rem;  
            font-weight: 700; 
            margin-bottom: 8px;  
            letter-spacing: -0.02em; 
            color: var(--text-main);
        } 

        p {  
            color: var(--text-muted);  
            margin-bottom: 40px;  
            font-size: 0.9rem;  
            line-height: 1.6;  
            font-weight: 400; 
        } 

        /* Botão Único e Direto */
        .btn-group {  
            display: flex;  
            flex-direction: column;  
        } 

        .btn-primary { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 16px 24px; 
            background: var(--text-main);  
            color: var(--bg-body); 
            border-radius: 14px; 
            font-weight: 600; 
            text-decoration: none; 
            font-size: 0.95rem; 
            transition: transform 0.2s ease, background 0.2s ease; 
        } 

        .btn-primary:hover { 
            background: #e4e4e7; 
            transform: translateY(-2px); 
        } 

        .btn-primary:active { 
            transform: translateY(0); 
        } 

        .btn-primary .icon-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-primary i { 
            transition: transform 0.2s ease; 
        } 
        
        .btn-primary:hover .chevron {
            transform: translateX(4px);
        }

    </style> 
</head> 
<body> 

    <main class="card"> 
        <div class="logo-wrapper"> 
            <img src="https://github.com/danmaxy/atlas/blob/main/IMPERIUM.png?raw=true" alt="Logotipo Atlas"> 
        </div> 
         
        <header> 
            <h1>Atlas</h1> 
            <p>Repositório oficial de softwares e ferramentas técnicas.</p> 
        </header> 

        <nav class="btn-group"> 
            <a href="softwares.html" class="btn-primary"> 
                <span class="icon-left">
                    <i data-lucide="folder-archive" size="20"></i>
                    Acessar Softwares
                </span>
                <i data-lucide="arrow-right" class="chevron" size="18"></i> 
            </a> 
        </nav> 
    </main> 

    <script> 
        // Inicializa os ícones Lucide 
        lucide.createIcons(); 
    </script> 
</body> 
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - Painel de Gestão</title>
    <style>
        /* --- ESTILOS GERAIS E VARIÁVEIS --- */
        :root {
            --bg-body: #f0f2f5; --sidebar: #ffffff;
            --primary: #1e293b; --primary-hover: #334155;
            --accent: #2563eb; --accent-hover: #1d4ed8;
            --success: #10b981; --warning: #f59e0b; 
            --danger: #ef4444; --purple: #8b5cf6;
            --text-main: #334155; --text-light: #64748b;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* --- TELA DE LOGIN --- */
        #login-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box { 
            background: white; padding: 40px; border-radius: 12px; width: 360px; 
            text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
        }
        .login-box h1 { margin-bottom: 5px; color: var(--primary); letter-spacing: 3px; font-weight: 800; font-style: italic; }
        .login-box p { color: var(--text-light); margin-bottom: 25px; font-size: 14px; }
        .login-box input { 
            width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid var(--border); 
            border-radius: 6px; font-size: 15px; outline: none; transition: 0.2s;
        }
        .login-box input:focus { border-color: var(--accent); }
        .login-box button { 
            width: 100%; padding: 14px; background: var(--accent); color: white; border: none; 
            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .login-box button:hover { background: var(--accent-hover); }

        /* --- CABEÇALHO --- */
        #app-container { display: none; height: 100%; flex-direction: column; }
        header { 
            background: var(--sidebar); border-bottom: 1px solid var(--border);
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 22px; font-weight: 800; font-style: italic; color: var(--primary); letter-spacing: 2px;}
        .tabs { display: flex; gap: 20px; }
        .tab-btn { 
            background: none; border: none; font-size: 15px; font-weight: 600; color: var(--text-light); 
            cursor: pointer; padding: 8px 0; border-bottom: 3px solid transparent; transition: 0.2s;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .header-actions button { 
            padding: 8px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 10px; font-size: 13px;
        }
        .btn-backup { background: var(--primary); color: white; }
        .btn-logout { background: transparent; color: var(--danger); border: 1px solid var(--danger); }

        /* --- LAYOUT PRINCIPAL --- */
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 340px; background: var(--sidebar); padding: 25px; border-right: 1px solid var(--border); overflow-y: auto; }
        .content-area { flex: 1; padding: 25px; overflow-y: auto; background: var(--bg-body); }
        
        /* --- FORMULÁRIOS --- */
        .sidebar h2 { font-size: 18px; margin-bottom: 20px; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: #f8fafc; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); background: white; }
        .btn-save { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* --- DASHBOARD IPHONES --- */
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .metric-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 5px solid var(--text-light); }
        .metric-card h3 { font-size: 13px; color: var(--text-light); text-transform: uppercase; margin-bottom: 8px; }
        .metric-card .value { font-size: 26px; font-weight: bold; color: var(--primary); }
        .metric-investido { border-left-color: var(--warning); }
        .metric-lucro { border-left-color: var(--success); }

        /* --- TABELAS --- */
        .table-container { background: white; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        thead { background: #f8fafc; border-bottom: 1px solid var(--border); }
        th { padding: 15px 20px; font-size: 12px; font-weight: 700; color: var(--text-light); text-transform: uppercase; }
        td { padding: 15px 20px; font-size: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:hover { background: #f8fafc; }
        
        /* --- BADGES E AÇÕES --- */
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; color: white; display: inline-block; text-align: center;}
        .bg-correios { background: var(--warning); }
        .bg-estoque { background: var(--accent); }
        .bg-anunciado { background: var(--purple); }
        .bg-vendido { background: var(--success); }
        
        select.action-select { padding: 6px; border-radius: 4px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px;}
        .btn-sell { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h1>ATLAS</h1>
            <p>Acesso Restrito - Gestão</p>
            <input type="text" id="user" placeholder="Usuário">
            <input type="password" id="pass" placeholder="Senha">
            <button onclick="fazerLogin()">Acessar</button>
        </div>
    </div>

    <!-- 2. SISTEMA PRINCIPAL -->
    <div id="app-container">
        <header>
            <div class="logo">ATLAS</div>
            <div class="tabs">
                <button class="tab-btn active" onclick="mudarAba('apple')" id="tab-apple">Revenda Apple</button>
                <button class="tab-btn" onclick="mudarAba('geral')" id="tab-geral">Estoque de Peças</button>
            </div>
            <div class="header-actions">
                <button class="btn-backup" onclick="fazerBackup()">Fazer Backup (JSON)</button>
                <button class="btn-logout" onclick="location.reload()">Sair</button>
            </div>
        </header>

        <!-- ABA 1: REVENDA APPLE -->
        <div class="main-content" id="view-apple">
            <aside class="sidebar">
                <h2>Cadastrar iPhone</h2>
                <div class="form-group"><label>Modelo</label><input type="text" id="ip_modelo" placeholder="Ex: iPhone 13 Pro"></div>
                <div class="form-group"><label>Capacidade (GB)</label><input type="text" id="ip_cap" placeholder="Ex: 128"></div>
                <div class="form-group"><label>Valor Pago (R$)</label><input type="number" id="ip_compra" placeholder="0.00" step="0.01"></div>
                <div class="form-group">
                    <label>Situação Inicial</label>
                    <select id="ip_sit">
                        <option value="Correios">Em trânsito (Correios)</option>
                        <option value="Estoque" selected>Em Estoque</option>
                        <option value="Anunciado">Anunciado</option>
                    </select>
                </div>
                <!-- Botão já informa que calcula os 30% -->
                <button class="btn-save" onclick="cadastrarIphone()">Salvar (Lucro 30% Auto)</button>
            </aside>

            <div class="content-area">
                <div class="metrics-grid">
                    <div class="metric-card metric-investido">
                        <h3>Capital Parado (Investido)</h3>
                        <div class="value" id="dash-investido">R$ 0,00</div>
                    </div>
                    <div class="metric-card metric-lucro">
                        <h3>Lucro do Mês (Vendas)</h3>
                        <div class="value" id="dash-lucro">R$ 0,00</div>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Modelo / GB</th><th>Custo</th><th>Venda Sugerida</th><th>Status</th><th>Ações</th></tr>
                        </thead>
                        <tbody id="tabela-iphones"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ABA 2: ESTOQUE GERAL -->
        <div class="main-content" id="view-geral" style="display: none;">
            <aside class="sidebar">
                <h2>Cadastrar Peça</h2>
                <div class="form-group"><label>Nome da Peça/Serviço</label><input type="text" id="g_nome" placeholder="Ex: SSD 240GB Kingston"></div>
                <div class="form-group"><label>Custo (R$)</label><input type="number" id="g_compra" placeholder="0.00" step="0.01"></div>
                <div class="form-group"><label>Preço de Venda (R$)</label><input type="number" id="g_venda" placeholder="0.00" step="0.01"></div>
                <div class="form-group"><label>Quantidade no Estoque</label><input type="number" id="g_estoque" placeholder="Ex: 5"></div>
                <button class="btn-save" onclick="cadastrarGeral()">Salvar Produto</button>
            </aside>

            <div class="content-area">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Produto</th><th>Custo</th><th>Venda</th><th>Qtd</th><th>Ações</th></tr>
                        </thead>
                        <tbody id="tabela-geral"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. LÓGICA JAVASCRIPT (LOCALSTORAGE) -->
    <script>
        // Formataador de Dinheiro para Real
        const formatadorBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

        // --- SISTEMA DE LOGIN (Frontend) ---
        function fazerLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            // Credenciais fixas de acesso
            if (u === 'admin' && p === 'atlas26') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                carregarTudo();
            } else {
                alert("Acesso Negado. Usuário ou senha incorretos.");
            }
        }

        // --- CONTROLE DE ABAS ---
        function mudarAba(aba) {
            document.getElementById('view-apple').style.display = aba === 'apple' ? 'flex' : 'none';
            document.getElementById('view-geral').style.display = aba === 'geral' ? 'flex' : 'none';
            document.getElementById('tab-apple').classList.toggle('active', aba === 'apple');
            document.getElementById('tab-geral').classList.toggle('active', aba === 'geral');
        }

        // --- FUNÇÕES DE BANCO DE DADOS (LOCALSTORAGE) ---
        function lerDados(chave) {
            return JSON.parse(localStorage.getItem(chave)) || [];
        }
        function salvarDados(chave, dados) {
            localStorage.setItem(chave, JSON.stringify(dados));
        }

        function carregarTudo() {
            renderizarIphones();
            renderizarGeral();
        }

        // --- ABA: REVENDA APPLE ---
        function renderizarIphones() {
            const iphones = lerDados('atlas_iphones_v1');
            const tbody = document.getElementById('tabela-iphones');
            tbody.innerHTML = '';
            
            let investido = 0;
            let lucro = 0;

            iphones.forEach((ip, index) => {
                // Cálculo das métricas
                if (ip.situacao !== 'Vendido') {
                    investido += ip.compra;
                } else {
                    lucro += (ip.venda - ip.compra);
                }

                // Configuração das cores do Status
                let badge = 'bg-estoque';
                if (ip.situacao === 'Correios') badge = 'bg-correios';
                if (ip.situacao === 'Anunciado') badge = 'bg-anunciado';
                if (ip.situacao === 'Vendido') badge = 'bg-vendido';

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${ip.modelo}</strong> <span style="color:#64748b; font-size:12px;">(${ip.capacidade}GB)</span></td>
                        <td>${formatadorBRL.format(ip.compra)}</td>
                        <td style="color:var(--success); font-weight:bold;">${formatadorBRL.format(ip.venda)}</td>
                        <td><span class="badge ${badge}">${ip.situacao}</span></td>
                        <td>
                            <select class="action-select" onchange="mudarStatusIphone(${index}, this.value)" ${ip.situacao === 'Vendido' ? 'disabled' : ''}>
                                <option value="">Mover para...</option>
                                <option value="Correios">Correios</option>
                                <option value="Estoque">Estoque</option>
                                <option value="Anunciado">Anunciado</option>
                                <option value="Vendido">Vendido!</option>
                            </select>
                            <button class="btn-delete" onclick="deletarIphone(${index})">X</button>
                        </td>
                    </tr>
                `;
            });

            // Atualiza o Dashboard
            document.getElementById('dash-investido').innerText = formatadorBRL.format(investido);
            document.getElementById('dash-lucro').innerText = formatadorBRL.format(lucro);
        }

        function cadastrarIphone() {
            const modelo = document.getElementById('ip_modelo').value;
            const cap = document.getElementById('ip_cap').value;
            const compra = parseFloat(document.getElementById('ip_compra').value);
            const sit = document.getElementById('ip_sit').value;

            if(!modelo || !cap || isNaN(compra)) return alert("Preencha todos os campos do iPhone!");

            const iphones = lerDados('atlas_iphones_v1');
            
            // CÁLCULO DE 30% DE LUCRO AUTOMÁTICO
            const venda = compra * 1.30; 

            iphones.push({ modelo, capacidade: cap, compra, venda, situacao: sit });
            salvarDados('atlas_iphones_v1', iphones);

            // Limpa form
            document.getElementById('ip_modelo').value = '';
            document.getElementById('ip_cap').value = '';
            document.getElementById('ip_compra').value = '';
            
            renderizarIphones();
        }

        function mudarStatusIphone(index, novoStatus) {
            if(!novoStatus) return;
            const iphones = lerDados('atlas_iphones_v1');
            iphones[index].situacao = novoStatus;
            salvarDados('atlas_iphones_v1', iphones);
            renderizarIphones();
        }

        function deletarIphone(index) {
            if(confirm("Apagar este registro de iPhone?")) {
                const iphones = lerDados('atlas_iphones_v1');
                iphones.splice(index, 1);
                salvarDados('atlas_iphones_v1', iphones);
                renderizarIphones();
            }
        }

        // --- ABA: ESTOQUE GERAL ---
        function renderizarGeral() {
            const geral = lerDados('atlas_geral_v1');
            const tbody = document.getElementById('tabela-geral');
            tbody.innerHTML = '';
            
            geral.forEach((p, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${p.nome}</strong></td>
                        <td>${formatadorBRL.format(p.compra)}</td>
                        <td>${formatadorBRL.format(p.venda)}</td>
                        <td><strong style="color: ${p.estoque <= 2 ? 'var(--danger)' : 'var(--text-main)'}">${p.estoque}</strong></td>
                        <td>
                            <button class="btn-sell" onclick="venderGeral(${index})">Vender ( -1 )</button>
                            <button class="btn-delete" onclick="deletarGeral(${index})">X</button>
                        </td>
                    </tr>
                `;
            });
        }

        function cadastrarGeral() {
            const nome = document.getElementById('g_nome').value;
            const compra = parseFloat(document.getElementById('g_compra').value);
            const venda = parseFloat(document.getElementById('g_venda').value);
            const estoque = parseInt(document.getElementById('g_estoque').value);

            if(!nome || isNaN(compra) || isNaN(venda) || isNaN(estoque)) return alert("Preencha todos os campos da peça!");

            const geral = lerDados('atlas_geral_v1');
            geral.push({ nome, compra, venda, estoque });
            salvarDados('atlas_geral_v1', geral);

            document.getElementById('g_nome').value = '';
            document.getElementById('g_compra').value = '';
            document.getElementById('g_venda').value = '';
            document.getElementById('g_estoque').value = '';
            
            renderizarGeral();
        }

        function venderGeral(index) {
            const geral = lerDados('atlas_geral_v1');
            if (geral[index].estoque > 0) {
                geral[index].estoque -= 1;
                salvarDados('atlas_geral_v1', geral);
                renderizarGeral();
            } else {
                alert("Estoque zerado!");
            }
        }

        function deletarGeral(index) {
            if(confirm("Apagar esta peça do estoque?")) {
                const geral = lerDados('atlas_geral_v1');
                geral.splice(index, 1);
                salvarDados('atlas_geral_v1', geral);
                renderizarGeral();
            }
        }

        // --- SISTEMA DE BACKUP ---
        function fazerBackup() {
            const iphones = localStorage.getItem('atlas_iphones_v1') || '[]';
            const geral = localStorage.getItem('atlas_geral_v1') || '[]';
            const dadosBackup = `{ "iphones": ${iphones}, "geral": ${geral} }`;
            
            const blob = new Blob([dadosBackup], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            const dataHoje = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
            a.download = `Atlas_Backup_${dataHoje}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
